<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NDBox Upload Files</title>
    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #1a1a1a;
            color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            font-size: 13px;
        }
        #container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .row-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .row-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        select {
            min-width: 86px;
            height: 32px;
            padding: 0 28px 0 10px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #2b2b2b;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        select:hover {
            border-color: #777;
            background: #303030;
        }
        select:focus {
            border-color: #4c9ffe;
            box-shadow: 0 0 0 2px rgba(76, 159, 254, 0.2);
            background: #303030;
        }
        #upload-target {
            min-width: 92px;
        }
        #file-type {
            min-width: 84px;
            text-transform: lowercase;
        }
        input[type="file"] {
            flex: 1;
            min-width: 140px;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #2b2b2b;
            color: #fff;
            font-size: 13px;
        }
        button {
            cursor: pointer;
            height: 32px;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #2b2b2b;
            color: #fff;
            font-size: 13px;
            transition: border-color 0.15s ease, background 0.15s ease;
        }
        button:hover:not([disabled]) {
            border-color: #777;
            background: #303030;
        }
        button[disabled] {
            opacity: 0.4;
            cursor: not-allowed;
        }
        #path {
            padding: 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.4);
            word-break: break-all;
        }
        #status {
            font-size: 12px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="row">
            <div class="row-controls">
                <select id="upload-target">
                    <option value="output">output</option>
                    <option value="input">input</option>
                </select>
                <select id="upload-subdir">
                    <option value="3d">3d</option>
                </select>
                <select id="file-type">
                    <option value="any">any</option>
                    <option value="npz">npz</option>
                    <option value="npy">npy</option>
                    <option value="json">json</option>
                    <option value="txt">txt</option>
                    <option value="csv">csv</option>
                    <option value="bvh">bvh</option>
                    <option value="fbx">fbx</option>
                    <option value="obj">obj</option>
                    <option value="glb">glb</option>
                </select>
            </div>
            <div class="row-actions">
                <!-- 隐藏的文件输入：一个用于多文件，一个用于文件夹 -->
                <input id="file-input" type="file" multiple style="display:none;" />
                <input id="folder-input" type="file" webkitdirectory style="display:none;" />
                
                <!-- 两个选择按钮 + 上传按钮 -->
                <button id="choose-files-btn" type="button">选择文件</button>
                <button id="choose-folder-btn" type="button">选择文件夹</button>
                <button id="upload-btn" type="button">上传文件</button>
            </div>
        </div>
        <div id="path">当前路径：未上传</div>
        <div id="status">等待选择本地文件...</div>
    </div>

    <script>
        const ACCEPT_MAP = {
            any: "*/*",
            npz: ".npz",
            npy: ".npy",
            json: ".json",
            txt: ".txt",
            csv: ".csv",
            bvh: ".bvh",
            fbx: ".fbx",
            obj: ".obj",
            glb: ".glb",
        };
    
        const fileInput = document.getElementById("file-input");
        const folderInput = document.getElementById("folder-input");
        const chooseFilesBtn = document.getElementById("choose-files-btn");
        const chooseFolderBtn = document.getElementById("choose-folder-btn");
        const uploadBtn = document.getElementById("upload-btn");
        const uploadTargetSelect = document.getElementById("upload-target");
        const uploadSubdirSelect = document.getElementById("upload-subdir");
        const fileTypeSelect = document.getElementById("file-type");
        const pathEl = document.getElementById("path");
        const statusEl = document.getElementById("status");
    
        let lastAppliedFileType = null;
        let currentPath = "";
        let selectedFiles = [];   // 当前选中的文件列表
    
        function setStatus(text) {
            statusEl.textContent = text;
        }
    
        function setPath(path) {
            const normalized = (path || "").toString().trim();
            currentPath = normalized;
            pathEl.textContent = `当前路径：${normalized || "未上传"}`;
        }
    
        function updateAcceptByType(options = {}) {
            const { clearSelection = false, resetStatus = false } = options;
            const fileType = fileTypeSelect.value || "any";
            const typeChanged = fileType !== lastAppliedFileType;
            fileInput.accept = ACCEPT_MAP[fileType] || "*/*";
            folderInput.accept = ACCEPT_MAP[fileType] || "*/*";
            uploadBtn.textContent = fileType === "any" ? "上传文件" : `上传 .${fileType}`;
            if ((clearSelection || typeChanged)) {
                fileInput.value = "";
                folderInput.value = "";
                selectedFiles = [];
            }
            if (resetStatus || typeChanged) {
                setStatus(
                    fileType === "any"
                        ? "等待选择本地文件或文件夹..."
                        : `等待选择 .${fileType} 文件或文件夹...`
                );
            }
            lastAppliedFileType = fileType;
        }
    
        function updateSubdirState() {
            const isInput = (uploadTargetSelect.value || "output") === "input";
            uploadSubdirSelect.disabled = !isInput;
            uploadSubdirSelect.style.opacity = isInput ? "1" : "0.6";
        }
    
        async function refreshInputSubdirs() {
            try {
                const resp = await fetch("/NDBox/list_input_subdirs", { method: "GET" });
                const data = await resp.json();
                if (!resp.ok || !data?.ok || !Array.isArray(data.subdirs)) return;
                const oldValue = uploadSubdirSelect.value;
                uploadSubdirSelect.innerHTML = "";
                for (const subdir of data.subdirs) {
                    const opt = document.createElement("option");
                    opt.value = subdir;
                    opt.textContent = subdir;
                    uploadSubdirSelect.appendChild(opt);
                }
                if ([...uploadSubdirSelect.options].some((o) => o.value === oldValue)) {
                    uploadSubdirSelect.value = oldValue;
                }
            } catch (e) {
                // 保留现有回退选项
            }
        }
    
        // ========== 核心上传逻辑：支持多文件与文件夹 ==========
        async function UploadFiles() {
            const uploadTarget = uploadTargetSelect.value || "output";
            const uploadSubdir = uploadSubdirSelect.value || "3d";
            const fileType = fileTypeSelect.value || "any";
    
            if (selectedFiles.length === 0) {
                setStatus("请先选择文件或文件夹");
                return;
            }
    
            // 过滤符合类型要求的文件
            const validFiles = [];
            const skippedFiles = [];
            for (const file of selectedFiles) {
                if (file.size <= 0) {
                    skippedFiles.push(`${file.name} (空文件)`);
                    continue;
                }
                if (fileType !== "any" && !file.name.toLowerCase().endsWith(`.${fileType}`)) {
                    skippedFiles.push(`${file.name} (类型不匹配)`);
                    continue;
                }
                validFiles.push(file);
            }
    
            if (validFiles.length === 0) {
                setStatus("没有符合要求的文件可上传");
                return;
            }
    
            uploadBtn.disabled = true;
            const total = validFiles.length;
            let successCount = 0;
            let failCount = 0;
            const failedNames = [];
    
            for (let i = 0; i < total; i++) {
                const file = validFiles[i];
                setStatus(`正在上传 (${i + 1}/${total}): ${file.name}`);
    
                try {
                    const form = new FormData();
                    form.append("file", file, file.name);
                    form.append("file_type", fileType);
                    form.append("upload_target", uploadTarget);
                    form.append("upload_subdir", uploadSubdir);
    
                    const resp = await fetch("/NDBox/upload_files", {
                        method: "POST",
                        body: form,
                    });
                    const data = await resp.json();
    
                    if (!resp.ok || !data?.ok) {
                        throw new Error(data?.error || `HTTP ${resp.status}`);
                    }
    
                    successCount++;
                    const filePath = data.file_path || "";
                    setPath(filePath);
    
                    // 通知父窗口
                    window.parent.postMessage(
                        {
                            type: "ndbox_files_uploaded",
                            filePath,
                            fileType,
                            uploadTarget,
                            uploadSubdir,
                        },
                        "*"
                    );
                } catch (e) {
                    failCount++;
                    failedNames.push(`${file.name}: ${e.message || e}`);
                    console.warn(`[NDBox] 上传失败: ${file.name}`, e);
                }
            }
    
            // 汇总结果
            if (failCount === 0) {
                setStatus(`全部上传成功 (${successCount} 个文件)`);
            } else {
                const failMsg = failedNames.join("; ");
                setStatus(`上传完成：成功 ${successCount}，失败 ${failCount}。${failMsg}`);
            }
    
            if (skippedFiles.length > 0) {
                setStatus(statusEl.textContent + ` | 跳过 ${skippedFiles.length} 个文件`);
            }
    
            uploadBtn.disabled = false;
        }
    
        // ========== 选择文件按钮 ==========
        chooseFilesBtn.addEventListener("click", () => {
            fileInput.click();
        });
    
        // ========== 选择文件夹按钮 ==========
        chooseFolderBtn.addEventListener("click", () => {
            folderInput.click();
        });
    
        // ========== 文件选择变化时更新 selectedFiles ==========
        fileInput.addEventListener("change", () => {
            const files = fileInput.files;
            if (!files || files.length === 0) return;
            selectedFiles = Array.from(files);
            const fileType = fileTypeSelect.value || "any";
            // 类型校验
            const invalidFiles = selectedFiles.filter(
                (f) => fileType !== "any" && !f.name.toLowerCase().endsWith(`.${fileType}`)
            );
            if (invalidFiles.length > 0) {
                setStatus(`以下文件类型不匹配：${invalidFiles.map(f => f.name).join(", ")}`);
                fileInput.value = "";
                selectedFiles = [];
                return;
            }
            if (selectedFiles.length === 1) {
                setStatus(`已选择: ${selectedFiles[0].name}`);
            } else {
                setStatus(`已选择 ${selectedFiles.length} 个文件`);
            }
        });
    
        folderInput.addEventListener("change", () => {
            const files = folderInput.files;
            if (!files || files.length === 0) return;
            selectedFiles = Array.from(files);
            const fileType = fileTypeSelect.value || "any";
            // 过滤出符合类型的文件（文件夹中可能包含多种文件）
            const validFiles = selectedFiles.filter(
                (f) => fileType === "any" || f.name.toLowerCase().endsWith(`.${fileType}`)
            );
            if (validFiles.length === 0) {
                setStatus(`文件夹中没有 .${fileType} 类型的文件`);
                folderInput.value = "";
                selectedFiles = [];
                return;
            }
            selectedFiles = validFiles;
            setStatus(`已选择文件夹，包含 ${selectedFiles.length} 个文件`);
        });
    
        // ========== 其他控件事件 ==========
        uploadBtn.addEventListener("click", UploadFiles);
    
        fileTypeSelect.addEventListener("change", () => {
            updateAcceptByType({ clearSelection: true, resetStatus: true });
            window.parent.postMessage(
                {
                    type: "ndbox_files_file_type_changed",
                    fileType: fileTypeSelect.value || "any",
                },
                "*"
            );
        });
    
        uploadTargetSelect.addEventListener("change", () => {
            updateSubdirState();
            window.parent.postMessage(
                {
                    type: "ndbox_files_upload_target_changed",
                    uploadTarget: uploadTargetSelect.value || "output",
                },
                "*"
            );
        });
    
        uploadSubdirSelect.addEventListener("change", () => {
            window.parent.postMessage(
                {
                    type: "ndbox_files_upload_subdir_changed",
                    uploadSubdir: uploadSubdirSelect.value || "3d",
                },
                "*"
            );
        });
    
        window.addEventListener("message", (event) => {
            const data = event.data || {};
            if (data.type === "ndbox_files_state") {
                const incomingPath =
                    (typeof data.filePath === "string" && data.filePath)
                    || (typeof data.npzPath === "string" && data.npzPath)
                    || "";
                if (incomingPath || !currentPath) {
                    setPath(incomingPath);
                }
                if (typeof data.fileType === "string" && ACCEPT_MAP[data.fileType]) {
                    fileTypeSelect.value = data.fileType;
                    updateAcceptByType({ clearSelection: false, resetStatus: false });
                }
                if (typeof data.uploadTarget === "string" &&
                    (data.uploadTarget === "output" || data.uploadTarget === "input")) {
                    uploadTargetSelect.value = data.uploadTarget;
                    updateSubdirState();
                }
                if (typeof data.uploadSubdir === "string" && data.uploadSubdir) {
                    if ([...uploadSubdirSelect.options].some((o) => o.value === data.uploadSubdir)) {
                        uploadSubdirSelect.value = data.uploadSubdir;
                    }
                }
            }
        });
    
        // 初始化
        updateAcceptByType({ clearSelection: false, resetStatus: true });
        updateSubdirState();
        refreshInputSubdirs();
    </script>
</body>
</html>
